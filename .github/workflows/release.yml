name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # macOS: ship self-compiled binary (albite1) with self-compiled verification
  build-macos:
    name: Build (macOS ARM64)
    runs-on: macos-15
    
    steps:
      - uses: actions/checkout@v6
        with:
          # tools/claude-hooks is a git submodule AND a workspace member
          # (ADR 20.7.26b) — every cargo invocation needs it checked out.
          # scs-claude-hooks is private: SUBMODULES_PAT is a fine-grained PAT
          # (Contents: Read on this repo + scs-claude-hooks); the default
          # GITHUB_TOKEN cannot fetch a sibling private repo. Falls back to
          # github.token so jobs degrade (submodule fetch fails loudly) rather
          # than break at checkout while the secret is unset.
          submodules: true
          token: ${{ secrets.SUBMODULES_PAT || github.token }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
      - uses: Swatinem/rust-cache@v2
      
      - name: Install LLVM 18
        run: brew install llvm@18 zstd
      
      - name: Build bootstrap compiler
        env:
          LLVM_SYS_180_PREFIX: /opt/homebrew/opt/llvm@18
          LIBRARY_PATH: /opt/homebrew/lib
        run: cargo build --release
      
      - name: Self-compile — bootstrap → albite1
        env:
          LLVM_SYS_180_PREFIX: /opt/homebrew/opt/llvm@18
          LIBRARY_PATH: /opt/homebrew/lib
        run: ./target/release/albite compile src/compiler/main.tg -o albite1 -v
      
      - name: Verify — albite1 typechecks itself (self-compiled)
        run: ./albite1 check src/compiler/main.tg --max-errors=0
      
      - name: Package release archive
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          ARCHIVE="albite-${TAG}-macos-arm64"
          ./scripts/package-macos.sh albite1 target/release/albite "$ARCHIVE"
          cp -R examples README.md LICENSE "$ARCHIVE/"
          tar czf "${ARCHIVE}.tar.gz" "$ARCHIVE"
          echo "ARCHIVE=${ARCHIVE}.tar.gz" >> "$GITHUB_ENV"
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64
          path: ${{ env.ARCHIVE }}

  # Linux: ship bootstrap (Rust-built) binary
  # x86_64 self-host deferred to v1.5 — ships bootstrap binary for now
  build-linux:
    name: Build (Linux x86_64)
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v6
        with:
          # tools/claude-hooks is a git submodule AND a workspace member
          # (ADR 20.7.26b) — every cargo invocation needs it checked out.
          # scs-claude-hooks is private: SUBMODULES_PAT is a fine-grained PAT
          # (Contents: Read on this repo + scs-claude-hooks); the default
          # GITHUB_TOKEN cannot fetch a sibling private repo. Falls back to
          # github.token so jobs degrade (submodule fetch fails loudly) rather
          # than break at checkout while the secret is unset.
          submodules: true
          token: ${{ secrets.SUBMODULES_PAT || github.token }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
      - uses: Swatinem/rust-cache@v2
      
      - name: Install LLVM 18
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-18 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y llvm-18 llvm-18-dev libpolly-18-dev clang-18 lld-18 zlib1g-dev libzstd-dev
      
      - name: Build bootstrap compiler
        env:
          LLVM_SYS_180_PREFIX: /usr/lib/llvm-18
        run: cargo build --release
      
      - name: Package release archive
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          ARCHIVE="albite-${TAG}-linux-x86_64"
          ./scripts/package-linux.sh target/release/albite "$ARCHIVE"
          cp -R examples README.md LICENSE "$ARCHIVE/"
          tar czf "${ARCHIVE}.tar.gz" "$ARCHIVE"
          echo "ARCHIVE=${ARCHIVE}.tar.gz" >> "$GITHUB_ENV"
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x86_64
          path: ${{ env.ARCHIVE }}

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-macos, build-linux]
    steps:
      - uses: actions/checkout@v6
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Generate checksums
        run: |
          cd artifacts
          find . -name '*.tar.gz' -exec cp {} . \;
          shasum -a 256 *.tar.gz > checksums.txt
          cat checksums.txt

      # Production's body is the tagged commit's message: promotion derived it
      # from every same-X.Y.Z version production had not yet seen (ADR
      # 28.9.26a). Staging keeps the per-publish delta, changelog/vX.md. The
      # cat-file line drops the object headers, then the subject paragraph;
      # a publisher test runs this exact line, so keep it one line.
      #
      # Production is told apart by membership, not by name (ADR 20.10.26k D3):
      # publish/ is staging_only, so production never carries
      # publish/snapshot.toml and staging always does. A staging tree that lost
      # the file must not publish a snapshot commit's message as its notes, so
      # the production arm also requires the subject promotion writes: the tag.
      - name: Extract release notes
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          if [ ! -f publish/snapshot.toml ]; then
            SUBJECT="$(git log -1 --format=%s "$GITHUB_SHA")"
            if [ "$SUBJECT" != "$TAG" ]; then
              echo "::error::No publish/snapshot.toml, but commit subject '$SUBJECT' is not the promotion subject '$TAG'"
              exit 1
            fi
            git cat-file commit "$GITHUB_SHA" | sed '1,/^$/d' | sed '1,/^$/d' > release-notes.md
          else
            NOTES="changelog/v${VERSION}.md"
            if [ ! -f "$NOTES" ]; then
              echo "::error::No changelog found at $NOTES"
              exit 1
            fi
            cp "$NOTES" release-notes.md
          fi
          if [ ! -s release-notes.md ]; then
            echo "::error::The release notes for $TAG are empty"
            exit 1
          fi

      - name: Create draft GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          # Immutable releases lock assets on publication. Keep the release a
          # draft until every archive and the checksum file have uploaded.
          draft: true
          # A hyphenated tag (-alpha.N, -beta.N, -rc.N) is a pre-release, never
          # *Latest*. The stricter rule is the publisher's Version::is_prerelease.
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            artifacts/*.tar.gz
            artifacts/checksums.txt

      - name: Publish complete GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          gh release view "$tag" --json isDraft,assets |
            jq -e --arg tag "$tag" '
              .isDraft == true and
              (([.assets[] | select(.size > 0) | .name] | sort) ==
               (["checksums.txt", "albite-\($tag)-macos-arm64.tar.gz",
                 "albite-\($tag)-linux-x86_64.tar.gz"] | sort))
            '
          # Any suffix (alpha, beta, rc) is a pre-release: Version::is_prerelease.
          if [[ "$tag" == *-* ]]; then
            gh release edit "$tag" --draft=false --prerelease
          else
            gh release edit "$tag" --draft=false
          fi
