# Cost tier for every `albite test` entry file (ADR 6.8.26c D4/D7).
#
# WHY THIS FILE EXISTS. A cost-3 suite asserts types at *elaboration*; there is
# nothing for a runtime assertion counter to find, so running it at cost 5 makes
# every one of its tests report `ASSERTED NOTHING`. Five of these files already
# declared `--check-only` in their own `make` target, and `make tg-test`'s
# blanket loop ignored the declaration — the same file, two modes, one of them
# written down and unread. Moving the tier here puts it somewhere the RUNNER can
# see, so `albite test <file>` honours it with no flag and there is exactly one
# copy of the answer.
#
# The runner finds this file by walking up from the entry file's directory, so
# the directory holding it *is* the root every key below is relative to.
#
#   tier = 3   elaboration only. `expect_type` / `expect_error` / typed
#              let-bindings have already run by the time the body would; the
#              runner reports `Skipped (check-only)` and asserts nothing at
#              runtime because there is nothing to assert.
#   tier = 5   run the body and count executed assertions.
#
# THREE GUARDS make a declaration refutable rather than merely authoritative
# (D7) — a wrong tier is otherwise a *silent* way to make the vacuity census
# green by hiding tests instead of fixing them:
#
#   (a) a file that calls a runtime assertion may not be declared tier 3; the
#       runner errors. `test_string_concat.tg` was the live instance — declared
#       `--check-only` while making 14 runtime `assert_eq_string` calls.
#   (b) each tier-3 file's `Skipped` count is pinned against a literal in
#       ADR 6.8.26c §5, so a file cannot read as clean by losing tests.
#   (c) a file matching `must_declare` below but absent from `[files]` is a
#       runner error. Not a default: tier 3 would silently skip every new file,
#       tier 5 would quietly re-open the defect this file fixes.

# Globs whose matches MUST appear in [files]. `*` matches within one path
# segment. This is `make tg-test`'s own glob — every file the blanket gate runs
# has to have said which mode it wants.
must_declare = ["src/compiler/test_*.tg", "src/native_core/test_*.tg"]

[files]

# --- cost 3: type-level assertions, discharged during elaboration ------------

