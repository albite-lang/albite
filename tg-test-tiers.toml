"src/compiler/test_reserved_words.tg" = { tier = 5, why = "assert_eq_nat / _bool over whether each word in lexer/reserved.tg classifies as a keyword (ADR 6.10.26j AC 4). Tier 5 because the list types as List<String> whatever it holds; only running classify_keyword over it tells a listed identifier from a keyword" }
"src/compiler/test_lexer_literals.tg" ={ tier = 5, why = "assert_eq_nat / _bool over radix-prefixed number values and lexer error conditions (ADR 29.9.26k D2), migrated from the uncalled lexer/tests harness. Tier 5 because `0xFF` and `0o77` both type as a Nat token; only the runtime value tells a correct radix from a wrong one" }
"src/compiler/test_parse_recovery.tg" = { tier = 5, why = "assert_eq_* over where the self-host resumes after a failed item, which repeat reports it drops, and where an unterminated string stops (ADR 3.10.26j AC 1-3). Tier 5: every subject runs over a clean token list, hand-built error lists or the lexer alone, so the assertions execute" }
