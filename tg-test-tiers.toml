"src/compiler/test_selfhost_constructors.tg" = { tier = 5, why = "assert_eq_string / _nat over the binders and right-nested payload a constructor's Core term is built from, at one, two and three fields (ADR 3.9.26e). Tier 5 because a left-nested payload type-checks identically; only the rendered nesting tells them apart" }
"src/compiler/test_lexer.tg" = { tier = 5, why = "assert_eq_bool / _nat over what the self-hosted lexer's `tokenize` produces for identifiers, keywords, literals, comments and whole signatures (ADR 29.9.26k D2). Migrated from the uncalled lexer/tests harness, whose checks had never run. Tier 5 because a token list types identically whatever it holds; only the runtime kinds and counts discriminate" }
"src/compiler/test_package_reach.tg" = { tier = 5, why = "assert_eq_* over the self-host's package table, pub(crate)'s package boundary, bare-name reach by defining file and the post-mount refusals' pure halves (ADR 6.10.26p AC 1). Tier 5 because every subject returns a Bool, Nat or String whose VALUE is the rule; a type assertion cannot tell reachable from unreachable" }
