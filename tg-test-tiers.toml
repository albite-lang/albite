# --- expected failures (ADR 6.8.26c D6) ---------------------------------------
#
# The ONLY sanctioned way to leave a `albite test` finding un-repaired. It is
# deliberately narrow, because the three easy alternatives are all forms of
# lying: deleting the assertion, weakening its expected value, or demoting the
# file to tier 3 (guard (a) forbids that one mechanically).
#
# `adr` is REQUIRED and names the successor that will REMOVE the entry — an
# expected failure with nobody's name on it is just a disabled test. The entry
# is also self-cleaning: a listed test that PASSES fails the run, so the day the
# successor lands, the gate tells you to delete the entry rather than letting it
# rot green.
#
# The corpus currently has NO expected failures. ADR 7.8.26c registered the
# type arena on the evaluator, so the six `test_type_handle_to_codegen_type_*`
# tests its entry owned now execute and pass, and the entry deleted itself the
# way the paragraph above describes. The section stays because the mechanism
# does.
